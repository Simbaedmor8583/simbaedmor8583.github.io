<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evelyn Jones · Mock Cases</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f5f6; color: #13202a;
  }
  main { width: min(560px, 92vw); }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.sub { margin: 0 0 32px; color: #44525d; }
  a.card {
    display: block; padding: 20px 24px; margin-bottom: 16px;
    background: #ffffff; border: 1px solid #d4dce0; border-radius: 12px;
    text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.card:hover { border-color: #0d6b61; transform: translateY(-2px); }
  a.card h2 { margin: 0 0 4px; font-size: 18px; color: #0d6b61; }
  a.card p { margin: 0; color: #44525d; font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    body { background: #10181d; color: #e8eef0; }
    p.sub, a.card p { color: #a8b4bb; }
    a.card { background: #1b252a; border-color: #33404a; }
    a.card:hover { border-color: #0d6b61; }
  }
</style>
</head>
<body>
<main>
  <h1>Evelyn Jones</h1>
  <p class="sub">Interactive mock case practice tools</p>
  <a class="card" href="/harbor-bank-mock-case/">
    <h2>Harbor Bank Mock Case</h2>
    <p>Case interview practice: interviewer prompts, your move, then a strong answer revealed step by step.</p>
  </a>
  <a class="card" href="/fernway-ipo-mock-case/">
    <h2>Fernway IPO Mock Case</h2>
    <p>IPO case interview practice with the same step-by-step prompt, answer, and exhibits loop.</p>
  </a>
</main>
</body>
</html>
